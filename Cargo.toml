[package]
name = "aws-utils"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "AWS pipeline management utility for mindtwo: check stage state, generate changelogs, approve releases, run multi-pipeline recipes, and audit S3 buckets."
license = "MIT"
repository = "https://github.com/mindtwo/gen-aws-changelog"

[[bin]]
name = "aws-utils"
path = "src/main.rs"

[dependencies]
# AWS SDKs
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-codepipeline = "1"

# CLI & async
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }

# Data & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# File & config management
dirs = "5"
anyhow = "1"
thiserror = "1"

# Terminal output
colored = "2"
prettytable-rs = "0.10"
indicatif = "0.17"

# Interactive prompts
dialoguer = "0.11"

# GitHub & HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
git2 = "0.19"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment variables
dotenvy = "0.15"

# Utility
regex = "1"
once_cell = "1"
futures = "0.3"

# TUI
ratatui = "0.28"
crossterm = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
